name: Manual
on: workflow_dispatch
env:
  COURSE: DevOps
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Variable
        run: echo Course is $COURSE
      - name: Actor
        run: echo Triggered by ${{ github.actor }}
      - name: Secret
        run: echo Secret is ${{ secrets.MY_SECRET }}
